aid: biolevate
name: Biolevate
description: >-
  Biolevate is an AI Knowledge Platform accelerating life sciences. Its Elise platform connects to an
  organization's document storage backends (S3, Azure, GCS, SharePoint, SFTP, local), indexes documents
  with AI, and runs asynchronous Question Answering, Extraction, Multi-Dimensional (entity/tabular)
  Extraction, Find-Similar and Agent jobs over them. Target workflows span regulatory affairs, R&D,
  industry and post-market: systematic literature review, Clinical Study Report (CSR) and CTD assisted
  generation, batch-record quality control, results extraction, HTA support, pharmacovigilance PSUR
  updates and regulatory intelligence. Biolevate ships a public REST API (OpenAPI 3.1), a Python SDK
  (`biolevate`) and a CLI (`ozk`). Backed by EQT Ventures.
